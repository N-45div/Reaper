<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaper — obligations ledger</title>
<style>
  :root {
    --paper: #fbfaf7; --card: #ffffff; --ink: #191917; --muted: #6e6b63; --hair: #e4e2da;
    --wax: #8c2318; --wax-soft: #f7e9e7; --ledger: #1e5c3a; --ledger-soft: #e9f2ec;
    --amber: #8a6100; --amber-soft: #f7efdc; --ink-soft: #efeee9;
    --serif: Georgia, "Times New Roman", serif;
    --sans: "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 14px/1.55 var(--sans); border-top: 6px solid var(--ink); }
  a { color: inherit; text-decoration: none; }

  header { border-bottom: 1px solid var(--hair); background: var(--paper); }
  header .bar { max-width: 1380px; margin: 0 auto; padding: 16px 28px; display: flex; align-items: baseline; gap: 18px; }
  .mark { font-family: var(--serif); font-size: 19px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  header .right { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 16px; align-items: center; }
  header .right b { color: var(--ink); }
  button.mini { font: 600 11.5px var(--sans); letter-spacing: .6px; padding: 6px 12px; background: var(--card); border: 1px solid var(--ink); color: var(--ink); cursor: pointer; }
  button.mini:hover { background: var(--ink-soft); }
  button.mini.kill { border-color: var(--wax); color: var(--wax); }
  button.mini.kill:hover { background: var(--wax-soft); }

  main { display: grid; grid-template-columns: 320px minmax(0,1fr) 296px; gap: 22px; padding: 24px 28px; max-width: 1380px; margin: 0 auto; }
  .box { background: var(--card); border: 1px solid var(--hair); }
  .box .bh { padding: 12px 18px; border-bottom: 1px solid var(--hair); font-size: 11px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .box .bb { padding: 16px 18px; }

  #drop { border: 1px dashed #c9c5ba; padding: 24px 16px; text-align: center; color: var(--muted); cursor: pointer; transition: .15s; }
  #drop:hover, #drop.hover { border-color: var(--ink); color: var(--ink); background: var(--ink-soft); }
  #drop b { display: block; font-family: var(--serif); font-size: 15.5px; color: var(--ink); margin-bottom: 3px; }
  #drop small { font-size: 12px; }

  .ob { padding: 13px 16px; border-bottom: 1px solid var(--hair); cursor: pointer; transition: .12s; position: relative; }
  .ob:last-child { border-bottom: 0; }
  .ob:hover { background: var(--ink-soft); }
  .ob.sel { box-shadow: inset 3px 0 0 var(--ink); background: var(--ink-soft); }
  .ob .v { font-family: var(--serif); font-size: 15px; font-weight: 600; }
  .ob .d { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .tag { float: right; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 700; padding: 2px 8px; border: 1px solid; margin-top: 2px; }
  .tag.SCHEDULED { color: var(--ink); border-color: #b9b5aa; background: var(--ink-soft); }
  .tag.AWAITING_APPROVAL { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
  .tag.NOTICE_SENT { color: var(--ink); border-color: var(--ink); }
  .tag.VERIFIED { color: var(--ledger); border-color: var(--ledger); background: var(--ledger-soft); }
  .tag.BLOCKED, .tag.REFUTED, .tag.DISPUTED { color: var(--wax); border-color: var(--wax); background: var(--wax-soft); }

  .docket-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 24px 0; }
  .docket-head h1 { font-family: var(--serif); font-weight: 600; font-size: 24px; }
  .docket-head .no { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stamp { transform: rotate(-6deg); border: 3px double; font-weight: 800; font-size: 13px; letter-spacing: 2.6px; padding: 7px 14px; text-transform: uppercase; white-space: nowrap; }
  .stamp.tone-ink { color: var(--ink); border-color: var(--ink); }
  .stamp.tone-green { color: var(--ledger); border-color: var(--ledger); }
  .stamp.tone-amber { color: var(--amber); border-color: var(--amber); }
  .stamp.tone-wax { color: var(--wax); border-color: var(--wax); }

  .acts { display: flex; margin: 20px 24px 0; border: 1px solid var(--hair); }
  .act { flex: 1; padding: 9px 12px; border-left: 1px solid var(--hair); font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .act:first-child { border-left: 0; }
  .act .rn { font-family: var(--serif); font-size: 14px; color: #c9c5ba; }
  .act.done { color: var(--ink); } .act.done .rn { color: var(--ink); }
  .act.now { color: var(--ink); background: var(--ink-soft); box-shadow: inset 0 -2px 0 var(--ink); }
  .act.now .rn { color: var(--ink); }
  .act.fail { color: var(--wax); background: var(--wax-soft); box-shadow: inset 0 -2px 0 var(--wax); }
  .act.fail .rn { color: var(--wax); }

  .narr { margin: 18px 24px 0; font-family: var(--serif); font-size: 16.5px; line-height: 1.6; }
  .narr .sub { font-family: var(--sans); font-size: 13px; color: var(--muted); display: block; margin-top: 3px; }

  .exhibit { margin: 18px 24px 0; border: 1px solid var(--hair); }
  .exhibit .eh { padding: 9px 16px; border-bottom: 1px solid var(--hair); font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .exhibit .clause { padding: 16px 20px; font-family: var(--serif); font-size: 14.5px; line-height: 1.7; font-style: italic; color: #333129; }
  .exhibit .cmp { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--hair); }
  .exhibit .vc { padding: 12px 16px; }
  .exhibit .vc + .vc { border-left: 1px solid var(--hair); }
  .exhibit .who { font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .exhibit .date { font-family: var(--mono); font-size: 17px; font-weight: 700; margin-top: 2px; }
  .exhibit .verdict-row { border-top: 1px solid var(--hair); padding: 9px 16px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
  .vmark { font-weight: 800; letter-spacing: 1.6px; font-size: 11.5px; }
  .vmark.MATCH { color: var(--ledger); } .vmark.MISMATCH, .vmark.AMBIGUOUS { color: var(--wax); }
  .verdict-row .why { color: var(--muted); font-size: 12px; }

  .actions { margin: 20px 24px; display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: 600 13.5px var(--sans); background: var(--card); color: var(--ink); border: 1px solid var(--ink); padding: 10px 20px; cursor: pointer; transition: .15s; }
  button:hover { background: var(--ink-soft); }
  button.solid { background: var(--ink); color: var(--paper); }
  button.solid:hover { background: #000; }
  button:disabled { opacity: .45; cursor: wait; }
  .actions .hint { font-size: 12px; color: var(--muted); align-self: center; }

  table.ledger { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.ledger th { text-align: left; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--ink); }
  table.ledger td { padding: 9px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  table.ledger tr:last-child td { border-bottom: 0; }
  td.no { font-family: var(--mono); color: var(--muted); width: 30px; }
  td.entry { font-weight: 700; white-space: nowrap; width: 150px; }
  td.entry.good { color: var(--ledger); } td.entry.bad { color: var(--wax); }
  td.desc { color: var(--muted); }
  td.time { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; width: 84px; }
  td.hash { font-family: var(--mono); font-size: 10.5px; color: var(--muted); cursor: pointer; width: 110px; }
  td.hash:hover { color: var(--ink); text-decoration: underline; }
  .chainline { font-family: var(--mono); font-size: 11.5px; }
  .chainline.y { color: var(--ledger); } .chainline.n { color: var(--wax); }

  .feed .row { padding: 10px 16px; border-bottom: 1px solid var(--hair); }
  .feed .row:last-child { border-bottom: 0; }
  .feed .v { font-family: var(--serif); font-weight: 600; font-size: 13px; }
  .feed .e { font-size: 12.5px; }
  .feed .e b { font-weight: 700; }
  .feed .t { font-family: var(--mono); font-size: 10.5px; color: var(--muted); float: right; }
  .feed .quiet { padding: 16px; color: var(--muted); font-size: 13px; }

  .empty { padding: 70px 40px; text-align: center; }
  .empty h3 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin-bottom: 10px; }
  .empty p { color: var(--muted); max-width: 400px; margin: 0 auto; font-size: 14px; }

  details.said { margin: 0 24px 20px; }
  details.said summary { cursor: pointer; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  #report { white-space: pre-wrap; font-size: 12.5px; color: var(--muted); background: var(--paper); border: 1px solid var(--hair); padding: 12px 14px; margin-top: 8px; max-height: 220px; overflow-y: auto; }

  .toast { position: fixed; bottom: 22px; right: 22px; background: var(--ink); color: var(--paper); padding: 13px 20px; font-size: 13px; display: none; max-width: 430px; box-shadow: 0 10px 30px rgba(25,25,23,.25); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--hair); border-top-color: var(--ink); border-radius: 50%; animation: r .8s linear infinite; vertical-align: -2px; }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (max-width: 1120px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="mark" href="/">Reaper</a>
    <span class="sub">Obligations ledger</span>
    <span class="right">
      <span>ledger date <b id="clock">—</b></span>
      <button class="mini" onclick="passTime()" title="Advance the calendar to the next event — the agent acts on its own">let time pass ▸</button>
      <button class="mini kill" onclick="chaosKill()" title="Kill the process mid-flight — durable state survives">kill the agent</button>
      <a class="mini" style="text-decoration:none" href="/calendar.ics" title="Subscribe to obligation deadlines from any calendar app">calendar ↧</a>
      <span>on watch <b id="n-watch">0</b></span><span>disputed <b id="n-disp">0</b></span><span id="busy"></span>
    </span>
  </div>
</header>

<main>
  <section>
    <div class="box">
      <div class="bh">File a contract</div>
      <div class="bb">
        <div id="drop"><b>Drop the agreement here</b><small>PDF or text · Reaper finds the renewal clause</small></div>
        <input id="file" type="file" hidden aria-label="Upload a contract file">
      </div>
    </div>
    <div class="box" style="margin-top:18px">
      <div class="bh">Entries</div>
      <div id="obs"></div>
    </div>
  </section>

  <section>
    <div class="box" id="detail"></div>
  </section>

  <section>
    <div class="box feed">
      <div class="bh">Register of actions</div>
      <div id="feed"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const ACTS = ["Read & gate", "Sleep", "Notice", "Verify"];
const ACT_STATE = {
  BLOCKED:           { done: 0, now: -1, fail: 1 },
  SCHEDULED:         { done: 1, now: 2, fail: -1 },
  AWAITING_APPROVAL: { done: 2, now: 3, fail: -1 },
  NOTICE_SENT:       { done: 3, now: 4, fail: -1 },
  VERIFIED:          { done: 4, now: -1, fail: -1 },
  REFUTED:           { done: 3, now: -1, fail: 4 },
  DISPUTED:          { done: 3, now: -1, fail: 4 },
};
const STAMP = {
  SCHEDULED: ["Filed · Scheduled", "tone-ink"],
  BLOCKED: ["Blocked", "tone-wax"],
  AWAITING_APPROVAL: ["Awaiting signature", "tone-amber"],
  NOTICE_SENT: ["Notice served", "tone-ink"],
  VERIFIED: ["Verified", "tone-green"],
  REFUTED: ["In breach", "tone-wax"],
  DISPUTED: ["Disputed", "tone-wax"],
};
const NARR = {
  BLOCKED: ["The gate refused this one.", "The engine could not independently confirm the deadline the model read — nothing is scheduled on an unverified date. It awaits human review."],
  SCHEDULED: ["Dormant, by design.", "Deadline verified and filed. No tokens burn while it waits — the agent wakes itself inside the notice window."],
  AWAITING_APPROVAL: ["The notice awaits your signature.", "Drafted and paused durably. Restart the server, come back next week — the run resumes at this exact instruction."],
  NOTICE_SENT: ["Notice served, receipt on file.", "Delivery hash-stamped into the chain. Now watching the vendor's next invoice."],
  VERIFIED: ["Honored. Case closed.", "The next invoice came in at the expected amount. The chore is finished, with evidence."],
  REFUTED: ["They billed anyway.", "The deterministic check caught an unauthorized charge. Preparing the dispute…"],
  DISPUTED: ["Dispute served — with receipts.", "Filed autonomously, attaching the timestamped delivery receipt as evidence that valid notice was given."],
};
const ENTRY = {
  WOKE:               ["Agent woke", "the calendar reached an event — no human trigger", ""],
  EXTRACTED:          ["Clause extracted", "Gemini quoted the renewal clause verbatim", ""],
  GATED:              ["Deadline gated", "engine re-derived the deadline independently", ""],
  APPROVAL_REQUESTED: ["Signature requested", "run paused durably for a human decision", ""],
  APPROVED:           ["Approved", "decision recorded: send the notice", "good"],
  REJECTED:           ["Rejected", "decision recorded: do not send", "bad"],
  NOTICE_SENT:        ["Notice served", "formal non-renewal notice delivered, receipt hash-stamped", ""],
  INVOICE_CHECKED:    ["Invoice read", "next-cycle invoice retrieved for verification", ""],
  VERIFIED:           ["Billing stopped", "deterministic check: vendor honored the cancellation", "good"],
  REFUTED:            ["Billed anyway", "deterministic check caught an unauthorized charge", "bad"],
  DISPUTE_OPENED:     ["Dispute served", "dispute filed with the delivery receipt as evidence", "bad"],
};

let obs = [], selId = null, lastReport = null;
const $ = id => document.getElementById(id);
const toast = m => { const t = $("toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 5200); };
const busy = on => $("busy").innerHTML = on ? '<span class="spin"></span>' : "";
const ago = ts => { const s = (Date.now() - new Date(ts + "Z")) / 1000; return s < 60 ? "now" : s < 3600 ? `${s/60|0}m` : s < 86400 ? `${s/3600|0}h` : `${s/86400|0}d`; };

async function refreshClock() {
  try {
    const c = await (await fetch("/clock")).json();
    $("clock").textContent = c.ledger_date + (c.offset_days ? ` (+${c.offset_days}d)` : "");
  } catch (e) { /* server mid-restart */ }
}

async function passTime() {
  const d = await (await fetch("/clock/advance", { method: "POST", headers: {"Content-Type":"application/json"}, body: "{}" })).json();
  toast(`The calendar advanced ${d.advanced_days} day${d.advanced_days === 1 ? "" : "s"} to ${d.ledger_date}. Watch the register — the agent acts on its own.`);
  refreshClock();
}

async function chaosKill() {
  toast("Killing the agent process mid-flight…");
  try { await fetch("/chaos/kill", { method: "POST" }); } catch (e) { /* it died mid-response, as intended */ }
  const t0 = Date.now();
  const wait = setInterval(async () => {
    try {
      const r = await fetch("/healthz");
      if (r.ok) {
        clearInterval(wait);
        toast(`Resurrected after ${((Date.now() - t0) / 1000).toFixed(1)}s — ledger, clock and any paused approval intact.`);
        refresh(); refreshClock();
      }
    } catch (e) { /* still down */ }
  }, 700);
}

async function refresh() {
  obs = await (await fetch("/obligations")).json();
  if (!selId && obs.length) selId = obs[0].id;
  $("n-watch").textContent = obs.filter(o => !["VERIFIED","DISPUTED","BLOCKED"].includes(o.status)).length;
  $("n-disp").textContent = obs.filter(o => o.status === "DISPUTED").length;
  $("obs").innerHTML = obs.length ? obs.map(o => `
    <div class="ob ${o.id===selId?"sel":""}" onclick="sel(${o.id})">
      <span class="tag ${o.status}">${(STAMP[o.status]||[o.status])[0]}</span>
      <div class="v">${o.vendor}</div>
      <div class="d">notice by ${o.engine_deadline ?? "—"}</div>
    </div>`).join("")
    : '<div class="bb" style="color:var(--muted);font-size:13px">No entries. File a contract above.</div>';
  renderDetail(); renderFeed();
}

function acts(status) {
  const s = ACT_STATE[status] ?? { done: 0, now: -1, fail: -1 };
  const RN = ["I","II","III","IV"];
  return `<div class="acts">${ACTS.map((a, i) => {
    const n = i + 1;
    const cls = s.fail === n ? "fail" : n <= s.done ? "done" : s.now === n ? "now" : "";
    return `<div class="act ${cls}"><span class="rn">${RN[i]}</span>${a}</div>`;
  }).join("")}</div>`;
}

function actionRow(o) {
  if (o.status === "SCHEDULED") return `<span class="hint">No action for you here. Let time pass — the agent wakes itself inside the notice window (by ${o.engine_deadline}).</span>`;
  if (o.status === "AWAITING_APPROVAL") return `
    <button class="solid" onclick="act(this,'/obligations/${o.id}/approval','POST',{approve:true})">Sign — send the notice</button>
    <button onclick="act(this,'/obligations/${o.id}/approval','POST',{approve:false})">Decline</button>`;
  if (o.status === "NOTICE_SENT") return `<span class="hint">Watching. When the term ends (${o.term_end}) the next invoice arrives and the agent verifies it unprompted.</span>`;
  return "";
}

function packLink(o) {
  if (["NOTICE_SENT", "VERIFIED", "REFUTED", "DISPUTED"].includes(o.status))
    return `<a class="mini" style="text-decoration:none" target="_blank" href="/obligations/${o.id}/pack" title="Printable chain-of-custody document">evidence pack ↗</a>`;
  return "";
}

async function renderDetail() {
  const el = $("detail");
  const o = obs.find(x => x.id === selId);
  if (!o) {
    el.innerHTML = `<div class="empty"><h3>An empty ledger</h3>
      <p>File a vendor agreement on the left. Reaper extracts the auto-renewal clause, proves
      the deadline twice, and runs the cancellation to a verified finish — you sign once.</p></div>`;
    return;
  }
  const rc = await (await fetch(`/obligations/${o.id}/receipts`)).json();
  const st = STAMP[o.status] ?? [o.status, "tone-ink"];
  const na = NARR[o.status] ?? [o.status, ""];
  const gateWhy = o.gate_verdict === "MATCH"
    ? "model and engine agree, to the day"
    : "engine could not confirm the model's reading — see register";
  el.innerHTML = `
    <div class="docket-head">
      <div><h1>${o.vendor}</h1><div class="no">OBLIGATION №${String(o.id).padStart(4,"0")} · term ends ${o.term_end}</div></div>
      <div class="stamp ${st[1]}">${st[0]}</div>
    </div>
    ${acts(o.status)}
    <div class="narr">${na[0]}<span class="sub">${na[1]}</span></div>
    <div class="exhibit">
      <div class="eh"><span>EXHIBIT — renewal clause, verbatim</span><span>notice to: ${o.recipient ?? "—"}</span></div>
      <div class="clause">“${o.clause_text.slice(0, 230)}${o.clause_text.length > 230 ? "…" : ""}”</div>
      <div class="cmp">
        <div class="vc"><div class="who">The model reads</div><div class="date">${o.llm_deadline ?? "—"}</div></div>
        <div class="vc"><div class="who">The engine derives</div><div class="date">${o.engine_deadline ?? "n/a"}</div></div>
      </div>
      <div class="verdict-row"><span class="vmark ${o.gate_verdict}">${o.gate_verdict}</span><span class="why">${gateWhy}</span></div>
    </div>
    <div class="actions">${actionRow(o)} ${packLink(o)}</div>
    <div class="bh" style="border-top:1px solid var(--hair)">Evidence chain
      <span class="chainline ${rc.chain_intact ? "y":"n"}">${rc.chain_intact ? "chain intact · sha-256" : "CHAIN BROKEN"}</span></div>
    <div class="bb" style="padding-top:6px">
      <table class="ledger">
        <tr><th>№</th><th>Entry</th><th>Description</th><th>Time</th><th>Hash</th></tr>
        ${rc.receipts.map((r, i) => {
          const e = ENTRY[r.kind] ?? [r.kind, "", ""];
          return `<tr><td class="no">${i+1}</td><td class="entry ${e[2]}">${e[0]}</td>
            <td class="desc">${e[1]}</td><td class="time">${ago(r.ts)} ago</td>
            <td class="hash" title="${r.hash}" onclick="navigator.clipboard.writeText('${r.hash}');toast('hash copied to clipboard')">${r.hash.slice(0,12)}…</td></tr>`;
        }).join("")}
      </table>
    </div>
    ${lastReport ? `<details class="said"><summary>Agent's full report</summary><div id="report">${lastReport}</div></details>` : ""}`;
}

async function renderFeed() {
  const acts = await (await fetch("/activity")).json();
  $("feed").innerHTML = acts.length ? acts.slice(0, 16).map(a => {
    const e = ENTRY[a.kind] ?? [a.kind, "", ""];
    return `<div class="row"><span class="t">${ago(a.ts)}</span><div class="v">${a.vendor}</div>
      <div class="e"><b>${e[0]}</b> — ${e[1]}</div></div>`;
  }).join("") : '<div class="quiet">The register is empty.</div>';
}

function sel(id) { selId = id; refresh(); }

async function act(btn, url, method, body) {
  btn.disabled = true; busy(true);
  try {
    const res = await fetch(url, { method, headers: {"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined });
    const d = await res.json();
    lastReport = d.report ?? d.detail ?? null;
    if (d.degraded) toast("Note: " + d.degraded);
  } catch (e) { toast("request failed: " + e); }
  busy(false); refresh();
}

$("drop").onclick = () => $("file").click();
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("hover"); };
$("drop").ondragleave = () => $("drop").classList.remove("hover");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("hover"); upload(e.dataTransfer.files[0]); };
$("file").onchange = () => upload($("file").files[0]);

async function upload(f) {
  if (!f) return;
  busy(true); toast("Reading the agreement — Gemma triage, then Gemini extraction…");
  const fd = new FormData(); fd.append("file", f);
  try {
    const d = await (await fetch("/contracts/upload", { method: "POST", body: fd })).json();
    lastReport = d.report ?? d.detail ?? null;
    if (d.triage?.ok) toast(d.triage.has_renewal
      ? `Triage (${d.triage.model}): renewal clause found${d.triage.section_hint ? " — " + d.triage.section_hint : ""}`
      : "Triage: no renewal clause in this document — nothing to schedule");
    if (d.obligations?.length) selId = d.obligations.at(-1).id;
  } catch (e) { toast("upload failed: " + e); }
  busy(false); refresh();
}

refresh(); refreshClock();
setInterval(refresh, 5000); setInterval(refreshClock, 5000);
</script>
</body>
</html>
